<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas WebGL Karakter</title>
</head>
<body style="margin: 0; overflow: hidden; font-family: sans-serif;">
    <canvas id="myCanvas" style="display: block; width: 100vw; height: 100vh; background-color: #ffffff;"></canvas>
    <div id="cameraControls" style="position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; color: #fff; background: rgba(0, 0, 0, 0.65); font-size: 13px; pointer-events: none;">
        Click to control camera  |  WASD move  |  Space rise  |  Shift descend
    </div>

    <div id="animationToggles" style="position: fixed; right: 12px; top: 12px; max-width: 330px; padding: 10px 14px; color: #fff; background: rgba(0, 0, 0, 0.65); font-size: 13px; line-height: 1.5;">
        <div style="font-weight: bold; margin-bottom: 6px;">Animasi</div>
        <label style="display: block; cursor: pointer; margin-bottom: 6px;">
            <input type="checkbox" id="toggleMouthe"> <b>[1] Mouthe</b>
        </label>
        <label style="display: block; cursor: pointer;">
            <input type="checkbox" id="toggleGundog"> <b>[2] Gundog</b>
        </label>
        <label style="display: block; cursor: pointer;">
            <input type="checkbox" id="toggleKnifo"> <b>[3] Knifo</b>
        </label>
        <div style="color: #bbb; font-size: 12px; margin-top: 6px;">Saat kamera aktif (mouse terkunci), tekan 1, 2, atau 3 di keyboard.</div>
    </div>

    <div id="movementToggles" style="position: fixed; right: 12px; top: 185px; max-width: 330px; padding: 10px 14px; color: #fff; background: rgba(0, 0, 0, 0.65); font-size: 13px; line-height: 1.5;">
        <div style="font-weight: bold; margin-bottom: 6px;">Gerak maju</div>
        <label style="display: block; cursor: pointer; margin-bottom: 6px;">
            <input type="checkbox" id="moveMouthe"> <b>[4] Mouthe</b>
        </label>
        <label style="display: block; cursor: pointer; margin-bottom: 6px;">
            <input type="checkbox" id="moveGundog"> <b>[5] Gundog</b>
        </label>
        <label style="display: block; cursor: pointer;">
            <input type="checkbox" id="moveKnifo"> <b>[6] Knifo</b>
        </label>
        <div style="color: #bbb; font-size: 12px; margin-top: 6px;">Toggle gerak terpisah dari toggle animasi.</div>
    </div>

    <!-- libs.js (LIBS) dimuat dulu, lalu main.js sebagai module. Buka lewat server lokal (Live Server). -->
    <script src="libs.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
